<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IRON GYM - Lịch sử</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

</head>


<body>

<div class="background-effects">

    <div class="glow glow-1"></div>

    <div class="glow glow-2"></div>

    <div class="grid-background"></div>

</div>


<aside class="sidebar">

    <div class="sidebar-logo">

        <div class="brand-icon">
            ⚡
        </div>

        <div>

            <h1>
                IRON<span>GYM</span>
            </h1>

            <p>
                MEMBER SYSTEM
            </p>

        </div>

    </div>


    <nav>

        <a href="dashboard.html"
           class="nav-item">

            <span>⌂</span>

            <span>
                Dashboard
            </span>

        </a>


        <a href="attendance.html"
           class="nav-item">

            <span>📸</span>

            <span>
                Điểm danh
            </span>

        </a>


        <a href="history.html"
           class="nav-item active">

            <span>📅</span>

            <span>
                Lịch sử
            </span>

        </a>

    </nav>


    <div class="sidebar-bottom">

        <div class="mini-profile">

            <div class="avatar"
                 id="sideAvatar">
                A
            </div>

            <div>

                <strong id="sideName">
                    Member
                </strong>

                <small id="sideCode">
                    GYM001
                </small>

            </div>

        </div>


        <button id="logoutButton"
                class="logout-button">

            ↪ Đăng xuất

        </button>

    </div>

</aside>


<main class="main-content">

    <header class="topbar">

        <div>

            <p class="top-label">
                ATTENDANCE
            </p>

            <h2>
                Lịch sử điểm danh
            </h2>

        </div>

    </header>


    <!-- Summary -->

    <section class="history-summary">

        <div class="summary-card">

            <span>
                TỔNG BUỔI TẬP
            </span>

            <strong id="historyTotal">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                THÁNG NÀY
            </span>

            <strong id="historyMonth">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                NGÀY GẦN NHẤT
            </span>

            <strong id="lastAttendance">
                --
            </strong>

        </div>

    </section>


    <!-- History -->

    <section class="panel history-panel">

        <div class="panel-header">

            <div>

                <span class="small-label">
                    RECORDS
                </span>

                <h3>
                    Các buổi tập
                </h3>

            </div>


            <button id="clearHistory"
                    class="danger-button">

                Xóa lịch sử

            </button>

        </div>


        <div id="historyList"
             class="history-list">

        </div>

    </section>

</main>


<script src="js/app.js"></script>

</body>

</html>
